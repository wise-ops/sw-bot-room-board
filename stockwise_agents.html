<!DOCTYPE html>
<!-- Stockwise Agents v3.0 -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stockwise — AI Agent Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--teal:#1D9E75;--teal-dark:#0F6E56;--teal-deep:#085041;--teal-light:#E1F5EE;--orange:#F97316;--cream:#F7F4EE;--border:#D8D0C0;--text:#1C1814;--muted:#6B6358;--white:#FDFCFA;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden;}
header{background:var(--teal-deep);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:white;}
.logo-sub{font-size:11px;color:#9FE1CB;}
.badge{font-size:11px;background:rgba(255,255,255,0.1);color:#9FE1CB;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);}

/* AGENT GRID VIEW */
#grid-view{padding:2rem;}
.grid-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:.4rem;}
.grid-sub{font-size:14px;color:var(--muted);margin-bottom:1.5rem;}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:2rem;}
.agent-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;text-align:center;padding:1.25rem 1rem;}
.agent-card:hover{transform:translateY(-4px);}
.agent-card.selected{border-width:2.5px;}
.card-canvas{display:block;margin:0 auto 10px;}
.card-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:2px;}
.card-role{font-size:11px;color:var(--muted);margin-bottom:10px;}
.card-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
.card-btn{width:100%;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;border:none;border-radius:8px;padding:8px;cursor:pointer;transition:opacity .15s;color:white;}
.card-btn:hover{opacity:.85;}
.collab-bar{display:flex;align-items:center;justify-content:space-between;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:2rem;}
.collab-bar-left{font-size:14px;color:var(--muted);}
.collab-bar-left span{font-weight:500;color:var(--text);}
.collab-start{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;background:var(--teal);color:white;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;transition:background .15s;}
.collab-start:hover{background:var(--teal-dark);}
.collab-start:disabled{background:var(--border);cursor:not-allowed;}

/* CHAT VIEW */
#chat-view{display:none;flex-direction:column;height:calc(100vh - 68px);}
.chat-top{background:var(--white);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:10px;}
.back-btn{background:none;border:none;cursor:pointer;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;transition:background .15s;}
.back-btn:hover{background:var(--cream);}
.chat-avatars{display:flex;gap:4px;margin:0 4px;}
.chat-avatar{width:36px;height:36px;border-radius:10px;flex-shrink:0;}
.chat-info{flex:1;}
.chat-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.chat-mode{font-size:11px;color:var(--muted);}
.messages{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:10px;}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;flex-direction:column;max-width:80%;}
.msg.user{align-self:flex-end;}
.msg.bot{align-self:flex-start;}
.msg-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.mini-av{width:20px;height:20px;border-radius:6px;flex-shrink:0;}
.msg-who{font-size:11px;font-weight:500;}
.bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.65;}
.msg.user .bubble{background:var(--teal);color:white;border-bottom-right-radius:4px;}
.msg.bot .bubble{background:var(--white);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
.msg.collab-msg .bubble{background:#1a1a2e;color:white;border-bottom-left-radius:4px;}
.collab-tag{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#9FE1CB;margin-bottom:3px;}
.msg-time{font-size:11px;color:var(--muted);margin-top:2px;padding:0 3px;}
.msg.user .msg-time{text-align:right;}
.typing-row{display:flex;align-items:center;gap:8px;align-self:flex-start;}
.typing-bub{background:var(--white);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:4px;}
@keyframes bob{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}
.dot{width:6px;height:6px;border-radius:50%;animation:bob 1.2s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
.qr-row{display:flex;flex-wrap:wrap;gap:6px;padding:.5rem 1.5rem;}
.qr{font-size:12px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;}
.qr:hover{border-color:var(--teal);color:var(--teal-dark);}
.input-row{padding:.75rem 1.5rem;background:var(--white);border-top:1px solid var(--border);display:flex;gap:8px;}
.msg-in{flex:1;font-family:'DM Sans',sans-serif;font-size:14px;border:1.5px solid var(--border);border-radius:22px;padding:9px 16px;outline:none;background:var(--cream);transition:border-color .15s;}
.msg-in:focus{border-color:var(--teal);background:var(--white);}
.send{width:38px;height:38px;border-radius:50%;border:none;background:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.send:hover{background:var(--teal-dark);}
.send svg{width:15px;height:15px;fill:white;}
@media(max-width:600px){.agent-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Stockwise Agents</div>
    <div class="logo-sub">Your AI team — powered by Claude</div>
  </div>
  <div class="badge">Jena &amp; Team</div>

<div id="grid-view" style="display:block;">

    <div class="collab-bar-left">Selected: <span id="selected-count">none</span></div>
    <button class="collab-start" id="collab-start-btn" onclick="startCollab()" disabled>Start team collab →</button>
  </div>
  <div class="agent-grid" id="agent-grid"></div>
</div>

<div id="chat-view" style="display:none;flex-direction:column;height:calc(100vh - 68px);">

    <button class="back-btn" onclick="backToGrid()">← Back</button>
    <div class="chat-avatars" id="chat-avatars"></div>

      <div class="chat-name" id="chat-name"></div>
      <div class="chat-mode" id="chat-mode"></div>
    </div>

  <div class="messages" id="messages"></div>
  <div class="qr-row" id="qr-row"></div>
  <div class="input-row">
    <input class="msg-in" id="msg-in" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button class="send" onclick="sendMsg()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

var selectedIds=[];
var chatAgents=[];
var history=[];
var loops={};

function loop(id,canvas,size){
  var agent=AGENTS.find(function(a){return a.id===id;});
  var t=0;
  function frame(){
    agent.draw(canvas,size,size,t++);
    loops[id+'_'+size]=requestAnimationFrame(frame);
  }
  frame();
}

function mkCanvas(id,size){
  var c=document.createElement('canvas');
  c.width=size;c.height=size;
  loop(id+'_'+Date.now(),c,size);
  return c;
}

function renderGrid(){
  var grid=document.getElementById('agent-grid');
  grid.innerHTML='';
  AGENTS.forEach(function(a){
    var card=document.createElement('div');
    card.className='agent-card';
    card.id='card-'+a.id;
    card.style.borderColor=a.color+'40';
    var cv=document.createElement('canvas');
    cv.className='card-canvas';cv.width=100;cv.height=100;
    card.appendChild(cv);
    var ag=a;
    var t=0;(function(agent,canvas){function f(){agent.draw(canvas,100,100,t++);requestAnimationFrame(f);}f();})(a,cv);
    card.innerHTML+=
      '<div class="card-name" style="color:'+a.color+'">'+a.name+'</div>'+
      '<div class="card-role">'+a.role+'</div>'+
      '<div class="card-desc">'+a.desc+'</div>'+
      '<button class="card-btn" style="background:'+a.color+'" onclick="chatOne(\''+a.id+'\')">Chat with '+a.name+' →</button>';
    card.onclick=function(e){if(e.target.tagName==='BUTTON')return;toggleSelect(a.id,card,a.color);};
    grid.appendChild(card);
  });
}

function toggleSelect(id,card,color){
  var idx=selectedIds.indexOf(id);
  if(idx===-1){
    selectedIds.push(id);
    card.classList.add('selected');
    card.style.borderColor=color;
  } else {
    selectedIds.splice(idx,1);
    card.classList.remove('selected');
    card.style.borderColor=color+'40';
  }
  var btn=document.getElementById('collab-start-btn');
  var count=document.getElementById('selected-count');
  if(selectedIds.length===0){count.textContent='none';btn.disabled=true;}
  else if(selectedIds.length===1){count.textContent='1 agent (select more to collaborate)';btn.disabled=true;}
  else{count.textContent=selectedIds.length+' agents selected';btn.disabled=false;}
}

function chatOne(id){
  chatAgents=[AGENTS.find(function(a){return a.id===id;})];
  history=[];
  showChat();
  var agent=chatAgents[0];
  document.getElementById('chat-name').textContent=agent.name;
  document.getElementById('chat-mode').textContent=agent.role+' Agent';
  var avs=document.getElementById('chat-avatars');avs.innerHTML='';
  var av=document.createElement('canvas');av.className='chat-avatar';av.width=72;av.height=72;
  avs.appendChild(av);
  var t=0;(function(ag,c){function f(){ag.draw(c,72,72,t++);requestAnimationFrame(f);}f();})(agent,av);
  var qr=document.getElementById('qr-row');qr.innerHTML='';
  agent.qr.forEach(function(r){
    var b=document.createElement('button');b.className='qr';b.textContent=r;
    b.onclick=function(){sendWithText(r);};qr.appendChild(b);
  });
  document.getElementById('messages').innerHTML='';
  setTimeout(function(){
    botMsg(agent.daily,agent);
    // Clear quick replies after opening message so they don't conflict
    setTimeout(function(){document.getElementById('qr-row').innerHTML='';},600);
  },400);
}

function startCollab(){
  if(selectedIds.length<2)return;
  chatAgents=selectedIds.map(function(id){return AGENTS.find(function(a){return a.id===id;});});
  history=[];
  showChat();
  var names=chatAgents.map(function(a){return a.name;}).join(', ');
  document.getElementById('chat-name').textContent='Team: '+names;
  document.getElementById('chat-mode').textContent='Collaboration mode — '+chatAgents.length+' agents';
  var avs=document.getElementById('chat-avatars');avs.innerHTML='';
  chatAgents.forEach(function(agent){
    var av=document.createElement('canvas');av.className='chat-avatar';av.width=72;av.height=72;
    avs.appendChild(av);
    var t=0;(function(ag,c){function f(){ag.draw(c,72,72,t++);requestAnimationFrame(f);}f();})(agent,av);
  });
  document.getElementById('qr-row').innerHTML='';
  document.getElementById('messages').innerHTML='';
  var intro='Hey team! 🤝 You\'ve got '+chatAgents.map(function(a){return a.name;}).join(', ')+' ready to collaborate. What should we work on together?';
  setTimeout(function(){
    var synthMsg=document.createElement('div');synthMsg.className='msg collab-msg';
    var b=document.createElement('div');b.className='bubble';
    b.innerHTML='<div class="collab-tag">Team ready</div>'+intro;
    synthMsg.appendChild(b);
    var msgs=document.getElementById('messages');msgs.appendChild(synthMsg);msgs.scrollTop=99999;
  },400);
}

function showChat(){
  document.getElementById('grid-view').style.display='none';
  document.getElementById('chat-view').style.display='flex';
}

function backToGrid(){
  document.getElementById('chat-view').style.display='none';
  document.getElementById('grid-view').style.display='block';
}

function botMsg(text,agent){
  var msgs=document.getElementById('messages');
  var msg=document.createElement('div');msg.className='msg bot';
  var meta=document.createElement('div');meta.className='msg-meta';
  var av=document.createElement('canvas');av.className='mini-av';av.width=40;av.height=40;
  meta.appendChild(av);
  var t=0;(function(ag,c){function f(){ag.draw(c,40,40,t++);requestAnimationFrame(f);}f();})(agent,av);
  var who=document.createElement('span');who.className='msg-who';who.style.color=agent.color;who.textContent=agent.name;
  meta.appendChild(who);msg.appendChild(meta);
  var b=document.createElement('div');b.className='bubble';b.innerHTML=text.replace(/\n/g,'<br>');
  var tm=document.createElement('div');tm.className='msg-time';tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  msg.appendChild(b);msg.appendChild(tm);msgs.appendChild(msg);msgs.scrollTop=99999;
}

function userMsg(text){
  var msgs=document.getElementById('messages');
  var msg=document.createElement('div');msg.className='msg user';
  var b=document.createElement('div');b.className='bubble';b.textContent=text;
  var tm=document.createElement('div');tm.className='msg-time';tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  msg.appendChild(b);msg.appendChild(tm);msgs.appendChild(msg);msgs.scrollTop=99999;
}

function showTyping(agent){
  var msgs=document.getElementById('messages');
  var row=document.createElement('div');row.className='typing-row';row.id='typ-'+agent.id;
  var av=document.createElement('canvas');av.className='mini-av';av.width=40;av.height=40;
  var t=0;(function(ag,c){function f(){ag.draw(c,40,40,t++);if(document.getElementById('typ-'+ag.id))requestAnimationFrame(f);}f();})(agent,av);
  row.appendChild(av);
  var tb=document.createElement('div');tb.className='typing-bub';
  for(var i=0;i<3;i++){var d=document.createElement('span');d.className='dot';d.style.background=agent.color;tb.appendChild(d);}
  row.appendChild(tb);msgs.appendChild(row);msgs.scrollTop=99999;
}

function removeTyping(id){var t=document.getElementById('typ-'+id);if(t)t.remove();}

async function callAPI(system,msgs){
  var r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':AKEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,system:system,messages:msgs})
  });
  var d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content[0].text;
}

async function getMem(id){
  try{var r=await window.storage.get('sw_mem_'+id);return r?JSON.parse(r.value):{count:0,exchanges:[]};}
  catch(e){return{count:0,exchanges:[]};}
}
async function saveMem(id,text){
  try{
    var m=await getMem(id);
    m.count=(m.count||0)+1;
    if(!m.exchanges)m.exchanges=[];
    m.exchanges.push({date:new Date().toLocaleDateString(),msg:text.substring(0,120)});
    if(m.exchanges.length>10)m.exchanges=m.exchanges.slice(-10);
    await window.storage.set('sw_mem_'+id,JSON.stringify(m));
  }catch(e){}
}
async function memCtx(id){
  try{
    var m=await getMem(id);
    if(!m.exchanges||!m.exchanges.length)return '';
    var ctx='\n\nPAST MEMORY: You have spoken with Jena '+m.count+' times. Recent topics:\n';
    m.exchanges.slice(-4).forEach(function(e){ctx+='- ['+e.date+'] '+e.msg+'\n';});
    return ctx;
  }catch(e){return '';}
}

async function sendMsg(){
  var input=document.getElementById('msg-in');
  var text=input.value.trim();
  if(!text)return;
  input.value='';
  await sendWithText(text);
}

async function sendWithText(text){
  document.getElementById('qr-row').innerHTML='';
  userMsg(text);
  history.push({role:'user',content:text});
  var histSnap=history.slice();

  if(chatAgents.length===1){
    var agent=chatAgents[0];
    showTyping(agent);
    try{
      var mc=await memCtx(agent.id);
      var sys=agent.system+'\n\n'+BIZ+mc;
      var reply=await callAPI(sys,histSnap);
      removeTyping(agent.id);
      history.push({role:'assistant',content:reply});
      botMsg(reply,agent);
      saveMem(agent.id,text);
    }catch(e){
      removeTyping(agent.id);
      botMsg('Sorry, something went wrong: '+e.message+'. Please try again.',agent);
      history.pop();
    }
  } else {
    var collabCtx=text;
    for(var i=0;i<chatAgents.length;i++){
      var ag=chatAgents[i];
      await new Promise(function(r){setTimeout(r,300*(i+1));});
      showTyping(ag);
      var prev=i===0?'':'\n\nYour teammates said:\n'+collabCtx;
      var prompt='Team topic: "'+text+'"'+prev+'\n\nAdd YOUR take as '+ag.name+' ('+ag.role+'). Build on what others said. 3-4 sentences. Stay in character.';
      try{
        var mc2=await memCtx(ag.id);
        var reply2=await callAPI(ag.system+'\n\n'+BIZ+mc2,[{role:'user',content:prompt}]);
        removeTyping(ag.id);
        collabCtx+='\n\n'+ag.name+': '+reply2;
        var msgs=document.getElementById('messages');
        var m=document.createElement('div');m.className='msg collab-msg';
        var meta=document.createElement('div');meta.className='msg-meta';
        var av=document.createElement('canvas');av.className='mini-av';av.width=40;av.height=40;
        meta.appendChild(av);
        var t=0;(function(agt,c){function f(){agt.draw(c,40,40,t++);requestAnimationFrame(f);}f();})(ag,av);
        var who=document.createElement('span');who.className='msg-who';who.style.color=ag.color;who.textContent=ag.name+' ('+ag.role+')';
        meta.appendChild(who);m.appendChild(meta);
        var b=document.createElement('div');b.className='bubble';
        b.innerHTML='<div class="collab-tag">Team contribution</div>'+reply2.replace(/\n/g,'<br>');
        m.appendChild(b);msgs.appendChild(m);msgs.scrollTop=99999;
        saveMem(ag.id,text);
      }catch(e){removeTyping(ag.id);}
    }
    await new Promise(function(r){setTimeout(r,500);});
    var synthAgent=chatAgents[0];
    showTyping(synthAgent);
    try{
      var synthPrompt='Team discussed: "'+text+'"\n\nEveryone said:\n'+collabCtx+'\n\nWrite a 2-3 sentence synthesis with the top action items for Jena. Direct and practical.';
      var synth=await callAPI('You are the Stockwise AI team giving Jena a final synthesis. '+BIZ,[{role:'user',content:synthPrompt}]);
      removeTyping(synthAgent.id);
      var msgs2=document.getElementById('messages');
      var sm=document.createElement('div');sm.className='msg collab-msg';sm.style.maxWidth='90%';
      var sb=document.createElement('div');sb.className='bubble';
      var gradColors=chatAgents.map(function(a){return a.color;});
      sb.style.background='linear-gradient(135deg,'+gradColors[0]+','+gradColors[gradColors.length-1]+')';
      sb.innerHTML='<div class="collab-tag">🤝 Team synthesis</div>'+synth.replace(/\n/g,'<br>');
      sm.appendChild(sb);msgs2.appendChild(sm);msgs2.scrollTop=99999;
    }catch(e){removeTyping(synthAgent.id);}
    history.push({role:'assistant',content:'[Team collaboration: '+collabCtx+']'});
  }
}

document.getElementById('msg-in').addEventListener('keydown',function(e){if(e.key==='Enter')sendMsg();});
renderGrid();
</script>
