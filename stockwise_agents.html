<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stockwise — AI Agents</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--teal:#1D9E75;--teal-dark:#0F6E56;--teal-deep:#085041;--teal-light:#E1F5EE;--orange:#F97316;--cream:#F7F4EE;--border:#D8D0C0;--text:#1C1814;--muted:#6B6358;--white:#FDFCFA;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
header{background:var(--teal-deep);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:white;letter-spacing:-0.5px;}
.logo-sub{font-size:11px;color:#9FE1CB;}
.badge{font-size:11px;background:rgba(255,255,255,0.1);color:#9FE1CB;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);}

/* GRID */
#grid-view{padding:2rem;display:block;}
.page-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;margin-bottom:.3rem;}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:1.5rem;}
.select-bar{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.select-info{font-size:13px;color:var(--muted);}
.collab-btn{background:var(--teal);color:white;border:none;border-radius:8px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
.collab-btn:disabled{background:var(--border);cursor:not-allowed;}
.collab-btn:not(:disabled):hover{background:var(--teal-dark);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.acard{background:var(--white);border:2px solid var(--border);border-radius:16px;padding:1.25rem 1rem;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s;}
.acard:hover{transform:translateY(-3px);}
.acard.sel{border-width:3px;}
.acard canvas{display:block;margin:0 auto 10px;border-radius:10px;}
.acard-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:2px;}
.acard-role{font-size:11px;color:var(--muted);margin-bottom:8px;}
.acard-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px;}
.chat-btn{width:100%;background:var(--teal);color:white;border:none;border-radius:8px;padding:8px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}
.chat-btn:hover{opacity:.85;}

/* CHAT */
#chat-view{display:none;flex-direction:column;height:calc(100vh - 64px);}
.chat-header{background:var(--white);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:10px;}
.back{background:none;border:none;font-size:13px;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:8px;}
.back:hover{background:var(--cream);}
.chat-avs{display:flex;gap:4px;}
.chat-av{width:38px;height:38px;border-radius:10px;}
.chat-info-name{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.chat-info-sub{font-size:11px;color:var(--muted);}
.msgs{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:10px;}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{max-width:80%;display:flex;flex-direction:column;}
.msg.u{align-self:flex-end;}
.msg.b{align-self:flex-start;}
.msg.co{align-self:flex-start;max-width:88%;}
.mmeta{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.mav{width:20px;height:20px;border-radius:6px;flex-shrink:0;}
.mwho{font-size:11px;font-weight:500;}
.bub{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.65;}
.msg.u .bub{background:var(--teal);color:white;border-bottom-right-radius:4px;}
.msg.b .bub{background:var(--white);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px;}
.msg.co .bub{background:#1a1a2e;color:white;border-bottom-left-radius:4px;}
.ctag{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#9FE1CB;margin-bottom:3px;}
.mtime{font-size:11px;color:var(--muted);margin-top:2px;padding:0 3px;}
.msg.u .mtime{text-align:right;}
.trow{display:flex;align-items:center;gap:8px;align-self:flex-start;}
.tbub{background:var(--white);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:4px;}
@keyframes bob{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-4px);}}
.tdot{width:6px;height:6px;border-radius:50%;animation:bob 1.2s infinite;}
.tdot:nth-child(2){animation-delay:.2s;}.tdot:nth-child(3){animation-delay:.4s;}
.input-area{background:var(--white);border-top:1px solid var(--border);padding:.75rem 1.5rem;display:flex;gap:8px;}
.msgin{flex:1;font-family:'DM Sans',sans-serif;font-size:14px;border:1.5px solid var(--border);border-radius:22px;padding:9px 16px;outline:none;background:var(--cream);}
.msgin:focus{border-color:var(--teal);background:var(--white);}
.sendbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--teal);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sendbtn:hover{background:var(--teal-dark);}
.sendbtn svg{width:15px;height:15px;fill:white;}
@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;}}
</style>
</head>

  <div>
    <div class="logo">Stockwise Agents</div>

</div>

// Get fresh Google access token using refresh token
async function getGoogleToken() {
  try {
    var r = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'client_id=' + G_CLIENT_ID + '&client_secret=' + G_CLIENT_SECRET + '&refresh_token=' + G_REFRESH_TOKEN + '&grant_type=refresh_token'
    });
    var d = await r.json();
    if (d.error) throw new Error(d.error);
    return d.access_token;
  } catch(e) { throw new Error('Google auth failed: ' + e.message); }
}

// Read Gmail inbox
async function gmailRead() {
  try {
    var token = await getGoogleToken();
    var r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=10&q=is:unread', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    var d = await r.json();
    if (d.error) return 'Gmail error: ' + d.error.message;
    if (!d.messages || d.messages.length === 0) return 'No unread emails found.';
    var result = 'Unread emails (' + d.messages.length + '):\n';
    for (var i = 0; i < Math.min(5, d.messages.length); i++) {
      var mr = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/' + d.messages[i].id + '?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date', {
        headers: {'Authorization': 'Bearer ' + token}
      });
      var md = await mr.json();
      var headers = {};
      (md.payload && md.payload.headers || []).forEach(function(h) { headers[h.name] = h.value; });
      result += (i+1) + '. From: ' + (headers.From || 'Unknown') + '\n   Subject: ' + (headers.Subject || 'No subject') + '\n   Date: ' + (headers.Date || '') + '\n\n';
    }
    return result;
  } catch(e) { return 'Gmail error: ' + e.message; }
}

// Send Gmail
async function gmailSend(to, subject, body) {
  try {
    var token = await getGoogleToken();
    var email = 'To: ' + to + '\r\nSubject: ' + subject + '\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n' + body;
    var encoded = btoa(unescape(encodeURIComponent(email))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    var r = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({raw: encoded})
    });
    var d = await r.json();
    if (d.error) return 'Gmail send error: ' + d.error.message;
    return 'Email sent successfully to ' + to + '!';
  } catch(e) { return 'Gmail error: ' + e.message; }
}

// Google Business Profile - get reviews
async function googleGetReviews() {
  try {
    var token = await getGoogleToken();
    var locR = await fetch('https://mybusinessaccountmanagement.googleapis.com/v1/accounts', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    var locD = await locR.json();
    if (locD.error) return 'Google Business error: ' + locD.error.message;
    if (!locD.accounts || locD.accounts.length === 0) return 'No Google Business accounts found.';
    var accountName = locD.accounts[0].name;
    var locsR = await fetch('https://mybusinessbusinessinformation.googleapis.com/v1/' + accountName + '/locations', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    var locsD = await locsR.json();
    if (!locsD.locations || locsD.locations.length === 0) return 'No locations found.';
    var locationName = locsD.locations[0].name;
    var revR = await fetch('https://mybusiness.googleapis.com/v4/' + locationName + '/reviews', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    var revD = await revR.json();
    if (revD.error) return 'Reviews error: ' + revD.error.message;
    if (!revD.reviews || revD.reviews.length === 0) return 'No reviews found yet.';
    var result = 'Google Reviews:\n';
    revD.reviews.slice(0, 5).forEach(function(rev, i) {
      result += (i+1) + '. ' + (rev.reviewer && rev.reviewer.displayName || 'Anonymous') + ' — ' + rev.starRating + '\n';
      result += '   ' + (rev.comment || 'No comment') + '\n\n';
    });
    return result;
  } catch(e) { return 'Google Business error: ' + e.message; }
}

// Reply to Google review
async function googleReplyReview(reviewName, reply) {
  try {
    var token = await getGoogleToken();
    var r = await fetch('https://mybusiness.googleapis.com/v4/' + reviewName + '/reply', {
      method: 'PUT',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({comment: reply})
    });
    var d = await r.json();
    if (d.error) return 'Reply error: ' + d.error.message;
    return 'Google review reply posted successfully!';
  } catch(e) { return 'Google reply error: ' + e.message; }
}

// Post to Facebook page
async function fbPost(message) {
  try {
    var r = await fetch('https://graph.facebook.com/v25.0/' + FB_PAGE_ID + '/feed', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: message, access_token: FB_TOKEN})
    });
    var d = await r.json();
    if (d.error) return 'Facebook error: ' + d.error.message;
    return 'Posted successfully! Post ID: ' + d.id;
  } catch(e) { return 'Error posting: ' + e.message; }
}

// Get recent Facebook posts and comments
async function fbGetPosts() {
  try {
    var r = await fetch('https://graph.facebook.com/v25.0/' + FB_PAGE_ID + '/posts?fields=message,created_time,comments{message,from,id},likes.summary(true)&limit=5&access_token=' + FB_TOKEN);
    var d = await r.json();
    if (d.error) return 'Facebook error: ' + d.error.message;
    var result = '';
    if (d.data) {
      d.data.forEach(function(post, i) {
        result += (i+1) + '. [' + (post.created_time || '').substring(0,10) + '] ' + (post.message || '').substring(0,100) + '\n';
        if (post.comments && post.comments.data && post.comments.data.length > 0) {
          post.comments.data.forEach(function(c) {
            result += '   Comment from ' + (c.from ? c.from.name : 'someone') + ': ' + c.message + ' [ID: ' + c.id + ']\n';
          });
        }
        result += '\n';
      });
    }
    return result || 'No posts found.';
  } catch(e) { return 'Error: ' + e.message; }
}

// Reply to a Facebook comment
async function fbReply(commentId, message) {

}

// Get Facebook page messages/DMs
async function fbGetMessages() {
  try {

            result += '  ' + (msg.from ? msg.from.name : 'Unknown') + ': ' + msg.message + '\n';
          });
        }
        result += '\n';
      });
    }
    return result || 'No messages found.';
  } catch(e) { return 'Error: ' + e.message; }
}
var SERPER_API = 'https://google.serper.dev/search';

async function webSearch(query) {
  try {
    var r = await fetch(SERPER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-KEY': SERPER_KEY },
      body: JSON.stringify({ q: query, num: 5, gl: 'us', hl: 'en' })
    });
    var d = await r.json();
    var results = '';
    if (d.organic) {
      d.organic.slice(0, 5).forEach(function(item, i) {
        results += (i+1) + '. ' + item.title + '\n' + item.snippet + '\nURL: ' + item.link + '\n\n';
      });
    }
    if (d.knowledgeGraph) {
      results = 'Featured: ' + (d.knowledgeGraph.description || '') + '\n\n' + results;
    }
    return results || 'No results found.';
  } catch(e) {
    return 'Search failed: ' + e.message;
  }
}

// ---- STATE ----
var sel = [];
var chatAgents = [];
var chatHistory = [];

// ---- ANIMATION ----
function animate(agent, canvas, size) {
  var t = 0;
  function frame() {
    agent.draw(canvas, size, size, t++);
    requestAnimationFrame(frame);
  }
  frame();
}

// ---- RENDER GRID ----
function renderGrid() {
  var grid = document.getElementById('agent-grid');
  grid.innerHTML = '';
  AGENTS.forEach(function(a) {
    var card = document.createElement('div');
    card.className = 'acard';
    card.id = 'card-' + a.id;
    card.style.borderColor = a.color + '40';

    var cv = document.createElement('canvas');
    cv.width = 100; cv.height = 100;
    card.appendChild(cv);
    animate(a, cv, 100);

    var nm = document.createElement('div');
    nm.className = 'acard-name';
    nm.style.color = a.color;
    nm.textContent = a.name;
    card.appendChild(nm);

    var rl = document.createElement('div');
    rl.className = 'acard-role';
    rl.textContent = a.role;
    card.appendChild(rl);

    var ds = document.createElement('div');
    ds.className = 'acard-desc';
    ds.textContent = a.desc;
    card.appendChild(ds);

    var btn = document.createElement('button');
    btn.className = 'chat-btn';
    btn.style.background = a.color;
    btn.textContent = 'Chat with ' + a.name + ' →';
    btn.onclick = function(e) { e.stopPropagation(); chatOne(a.id); };
    card.appendChild(btn);

    card.onclick = function() { toggleSel(a.id, card, a.color); };
    grid.appendChild(card);
  });
}

function toggleSel(id, card, color) {
  var idx = sel.indexOf(id);
  if (idx === -1) {
    sel.push(id);
    card.classList.add('sel');
    card.style.borderColor = color;
  } else {
    sel.splice(idx, 1);
    card.classList.remove('sel');
    card.style.borderColor = color + '40';
  }
  var info = document.getElementById('sel-info');
  var btn = document.getElementById('collab-btn');
  if (sel.length === 0) { info.textContent = 'Click cards to select for team collab'; btn.disabled = true; }
  else if (sel.length === 1) { info.textContent = '1 selected — pick more to collaborate'; btn.disabled = true; }
  else { info.textContent = sel.length + ' agents selected'; btn.disabled = false; }
}

// ---- CHAT ONE ----
function chatOne(id) {
  chatAgents = [AGENTS.find(function(a) { return a.id === id; })];
  chatHistory = [];
  showChat();
  var ag = chatAgents[0];
  document.getElementById('chat-iname').textContent = ag.name;
  document.getElementById('chat-isub').textContent = ag.role + ' Agent';
  buildAvatars();
  clearMsgs();
  setTimeout(function() { addBotMsg(ag.name + ': ' + getOpener(ag), ag); }, 400);
}

// ---- COLLAB ----
function startCollab() {
  if (sel.length < 2) return;
  chatAgents = sel.map(function(id) { return AGENTS.find(function(a) { return a.id === id; }); });
  chatHistory = [];
  showChat();
  var names = chatAgents.map(function(a) { return a.name; }).join(', ');
  document.getElementById('chat-iname').textContent = 'Team: ' + names;
  document.getElementById('chat-isub').textContent = 'Collaboration — ' + chatAgents.length + ' agents';
  buildAvatars();
  clearMsgs();
  setTimeout(function() {
    addCollabMsg('Your team of ' + chatAgents.length + ' is ready — ' + names + '. What should we work on together?');
  }, 400);
}

function getOpener(ag) {
  var openers = {
    rex: 'Before I start hunting — what type of business are you most excited to land this week?',
    nova: 'What\'s one thing happening in the business right now we could turn into a great post?',
    spark: 'What\'s one problem you\'ve seen a local business struggling with that Stockwise doesn\'t solve yet?',
    max: 'What\'s the one thing taking up the most mental space today? Let\'s tackle that first.',
    cal: 'What\'s the most important thing that MUST happen this week? I\'ll build the schedule around that.',
    penny: 'Tell me about your most recent consultation — what was the client\'s biggest problem?',
    echo: 'Any client situations that need extra care right now? Let\'s make sure we handle everything right.'
  };
  return openers[ag.id] || 'How can I help you today?';
}

// ---- API CALL ----
async function callAPI(systemPrompt, messages) {
  // First ask Claude if it needs to search the web
  var searchSystem = systemPrompt + '\n\n' + BIZ + '\n\nIMPORTANT: You have access to real-time web search. If the user is asking for information that would benefit from current data (business leads, trending topics, market info, client research, local events, etc.), respond ONLY with: SEARCH: [your search query]. Otherwise respond normally. If you need multiple searches, do one at a time starting with SEARCH:';
  
  var r1 = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-api-key': KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: 'claude-haiku-4-5-20251001', max_tokens: 200, system: searchSystem, messages: messages})
  });
  var d1 = await r1.json();
  if (d1.error) throw new Error(d1.error.message);
  var firstReply = d1.content[0].text.trim();

  // Handle tool commands
  var searchContext = '';
  var fr = firstReply.trim();
  if (fr.startsWith('SEARCH:')) {
    var query = fr.replace('SEARCH:', '').trim();
    var results = await webSearch(query);
    searchContext = '\n\nWEB SEARCH RESULTS for "' + query + '":\n' + results + '\nUse these real results.';
  } else if (fr.startsWith('FBPOST:')) {
    var postMsg = fr.replace('FBPOST:', '').trim();
    var postResult = await fbPost(postMsg);
    searchContext = '\n\nFACEBOOK RESULT: ' + postResult + '\nTell Jena what happened.';
  } else if (fr.startsWith('FBREAD:')) {
    var readType = fr.replace('FBREAD:', '').trim().toLowerCase();
    var fbData = readType === 'messages' ? await fbGetMessages() : await fbGetPosts();
    searchContext = '\n\nFACEBOOK DATA:\n' + fbData + '\nSummarize for Jena and suggest actions.';
  } else if (fr.startsWith('FBREPLY:')) {
    var rparts = fr.replace('FBREPLY:', '').trim().split('|');
    if (rparts.length >= 2) {
      var replyResult = await fbReply(rparts[0].trim(), rparts[1].trim());
      searchContext = '\n\nFACEBOOK REPLY RESULT: ' + replyResult + '\nTell Jena what happened.';
    }
  } else if (fr === 'GMAILREAD') {
    var emails = await gmailRead();
    searchContext = '\n\nGMAIL INBOX:\n' + emails + '\nSummarize for Jena and suggest responses.';
  } else if (fr.startsWith('GMAILSEND:')) {
    var gparts = fr.replace('GMAILSEND:', '').trim().split('|');
    if (gparts.length >= 3) {
      var sendResult = await gmailSend(gparts[0].trim(), gparts[1].trim(), gparts[2].trim());
      searchContext = '\n\nGMAIL RESULT: ' + sendResult + '\nTell Jena what happened.';
    }
  } else if (fr === 'GOOGLEREVIEWS') {
    var reviews = await googleGetReviews();
    searchContext = '\n\nGOOGLE REVIEWS:\n' + reviews + '\nSummarize for Jena and suggest reply strategies.';
  } else if (fr.startsWith('GOOGLEREPLY:')) {
    var grparts = fr.replace('GOOGLEREPLY:', '').trim().split('|');
    if (grparts.length >= 2) {
      var greplyResult = await googleReplyReview(grparts[0].trim(), grparts[1].trim());
      searchContext = '\n\nGOOGLE REPLY RESULT: ' + greplyResult + '\nTell Jena what happened.';
    }
  }

  // Now get the real response with search context if any
  var finalSystem = systemPrompt + '\n\n' + BIZ + searchContext;
  var r2 = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'x-api-key': KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({model: 'claude-haiku-4-5-20251001', max_tokens: 1000, system: finalSystem, messages: messages})
  });
  var d2 = await r2.json();
  if (d2.error) throw new Error(d2.error.message);
  return d2.content[0].text;
}

// ---- SEND ----
async function send() {
  var input = document.getElementById('msgin');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  chatHistory.push({ role: 'user', content: text });
  var snap = chatHistory.slice();

  if (chatAgents.length === 1) {
    // ONE ON ONE
    var agent = chatAgents[0];
    showTyping(agent);
    try {
      var reply = await callAPI(agent.persona, snap);
      removeTyping(agent.id);
      chatHistory.push({ role: 'assistant', content: reply });
      addBotMsg(reply, agent);
    } catch(e) {
      removeTyping(agent.id);
      addBotMsg('Sorry, something went wrong: ' + e.message, agent);
      history.pop();
    }
  } else {
    // TEAM COLLAB
    var thread = 'Topic: ' + text;
    for (var i = 0; i < chatAgents.length; i++) {
      var ag = chatAgents[i];
      await new Promise(function(r) { setTimeout(r, 350 * (i + 1)); });
      showTyping(ag);
      var prev = i === 0 ? '' : '\n\nYour teammates already said:\n' + thread;
      var prompt = 'The team is collaborating. Topic: "' + text + '"' + prev + '\n\nAdd YOUR unique perspective as ' + ag.name + ' (' + ag.role + '). Build on what others said. Be concise (3-4 sentences). Stay in your character.';
      try {
        var r2 = await callAPI(ag.persona, [{ role: 'user', content: prompt }]);
        removeTyping(ag.id);
        thread += '\n\n' + ag.name + ': ' + r2;
        addAgentCollabMsg(r2, ag);
      } catch(e) {
        removeTyping(ag.id);
      }
    }
    // SYNTHESIS
    await new Promise(function(r) { setTimeout(r, 500); });
    var lead = chatAgents[0];
    showTyping(lead);
    try {
      var synth = await callAPI('You are the Stockwise AI team giving a final synthesis. Be direct and practical. ' + BIZ, [{
        role: 'user',
        content: 'Team discussed: "' + text + '"\n\nEveryone said:\n' + thread + '\n\nGive Jena 2-3 clear action items from this discussion.'
      }]);
      removeTyping(lead.id);
      var msgs = document.getElementById('msgs');
      var sm = document.createElement('div');
      sm.className = 'msg co';
      sm.style.maxWidth = '90%';
      var sb = document.createElement('div');
      sb.className = 'bub';
      sb.style.background = 'linear-gradient(135deg,' + chatAgents[0].color + ',' + chatAgents[chatAgents.length-1].color + ')';
      sb.innerHTML = '<div class="ctag">🤝 Team action items</div>' + synth.replace(/\n/g, '<br>');
      sm.appendChild(sb);
      msgs.appendChild(sm);
      msgs.scrollTop = 99999;
    } catch(e) {
      removeTyping(lead.id);
    }
    chatHistory.push({ role: 'assistant', content: '[Team collab on: ' + text + ']' });
  }
}

document.getElementById('msgin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') send();
});
